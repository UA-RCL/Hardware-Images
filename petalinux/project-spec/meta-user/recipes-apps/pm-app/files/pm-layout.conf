# Cluster and kernel layout for the PE-array program manager.
#
# pm-app reads this at startup and uploads it to the hardware over the command
# bus, so editing it and restarting pm-app is all it takes to re-cluster the grid
# and change which kernel sits in which bank -- no Vitis HLS, no Vivado, no new
# bitstream.
#
# Syntax
#   grid <x> <y>
#       Must match the grid compiled into the bitstream. It is checked, not
#       obeyed: DIM_X/DIM_Y size the hardware's registers, so changing the grid
#       really does mean re-running synthesis (make ip GRID_DIM=...).
#
#   cluster <id> at <x> <y> size <w> <h> kernels <id>...
#       One rectangle, given as origin + size. Repeat the line with the same id
#       to build a non-rectangular cluster out of several rectangles.
#       `kernels` is positional: the first id goes in bank 0 of every PE in the
#       rectangle, the second in bank 1, and so on. 0 leaves a slot empty.
#       This is what the hardware enforces -- a RUN naming an empty bank is
#       refused -- so the list is the residency table, not a comment.
#
#   kernel <id> instr <n> [image <path>]
#       What to actually stream into the array for that kernel at startup. With
#       no `image`, pm-app generates n dummy 64-bit VLIW words; with one, it
#       sends the first n words of the file. Either way the transfer is real DMA
#       traffic into the manager's AXI-Stream port. A kernel with no `kernel`
#       line is declared in the table but nothing is streamed for it.
#
# Kernel ids run 1..255 -- the residency table is one byte per bank. Any PE no
# rectangle covers is a SPARE: it belongs to no cluster, matches no cluster
# dispatch, and refuses every RUN. Overlapping rectangles from different clusters
# are an error, not last-one-wins.

grid 8 8

# The default: the grid split down the middle. This reproduces the layout that
# used to be compiled into the bitstream, so a first boot with this file behaves
# exactly as it did without one.
cluster 0  at 0 0  size 4 8  kernels 101 102
cluster 1  at 4 0  size 4 8  kernels 201 202 203

# Exercise the instruction path on every boot. The PEs have no instruction memory
# yet, so the manager counts these words and discards them -- but the DMA, the
# stream port and the residency commit are all real, and `banks 0 0` after boot
# shows the tags they published.
kernel 101 instr 256
kernel 102 instr 256
kernel 201 instr 512
kernel 202 instr 512
kernel 203 instr 512

