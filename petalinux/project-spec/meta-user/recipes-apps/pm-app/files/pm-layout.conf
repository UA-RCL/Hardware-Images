# Cluster layout for the PE-array program manager.
#
# pm-app reads this at startup and uploads it to the hardware over the command
# bus, so editing it and restarting pm-app is all it takes to re-cluster the
# grid -- no Vitis HLS, no Vivado, no new bitstream.
#
# Syntax
#   grid <x> <y>
#       Must match the grid compiled into the bitstream. It is checked, not
#       obeyed: DIM_X/DIM_Y size the hardware's registers, so changing the grid
#       really does mean re-running synthesis (make ip GRID_DIM=...).
#
#   cluster <id> at <x> <y> size <w> <h> banks <n> [kernels <id>...]
#       One rectangle, given as origin + size. Repeat the line with the same id
#       to build a non-rectangular cluster out of several rectangles.
#       `banks` is how many kernel banks are resident, which is what the
#       hardware enforces: a RUN naming a bank >= this is refused.
#       `kernels` is metadata for display only.
#
# Any PE no rectangle covers is a SPARE: it belongs to no cluster, matches no
# cluster dispatch, and refuses every RUN. Overlapping rectangles from different
# clusters are an error, not last-one-wins.

grid 8 8

# The default: the grid split down the middle. This reproduces the layout that
# used to be compiled into the bitstream, so a first boot with this file behaves
# exactly as it did without one.
cluster 0  at 0 0  size 4 8  banks 2  kernels 101 102
cluster 1  at 4 0  size 4 8  banks 3  kernels 201 202 203

# Try something else -- comment out the two lines above and uncomment these to
# get a 2x2 corner, a strip, and 44 spare PEs, with no rebuild in between:
#
# cluster 0  at 0 0  size 2 2  banks 2  kernels 101 102
# cluster 1  at 0 3  size 8 1  banks 1  kernels 201
